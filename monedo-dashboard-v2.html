<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monedo Case Dashboard</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#182033;--muted:#6b7280;--line:#e1e5ec;--blue:#3046d3;--amber:#b87408;--red:#c52f3c;--green:#188858;--purple:#7651b8;--teal:#15899b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:22px 28px 10px;display:flex;justify-content:space-between;align-items:end;gap:16px}.title h1{margin:0;font-size:25px}.title p{margin:3px 0;color:var(--muted)}
button,input,select{font:inherit}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px}.toolbar input{min-width:250px}
.summary{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px;padding:12px 28px}.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px}.card small{color:var(--muted);display:block}.card b{font-size:25px;display:block;margin-top:2px}
.pipeline{display:flex;overflow-x:auto;padding:5px 28px 13px}.stage{background:var(--card);border:1px solid var(--line);min-width:175px;padding:12px 14px;cursor:pointer;text-align:left}.stage:first-child{border-radius:10px 0 0 10px}.stage:last-child{border-radius:0 10px 10px 0}.stage.on{outline:2px solid var(--blue);z-index:2}.stage b{font-size:24px;display:block}.stage span{font-weight:650}.stage small{color:var(--muted)}
.main{margin:0 28px 28px;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1100px}.table th{font-size:12px;color:var(--muted);text-align:left;padding:11px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top}.name{font-weight:650}.los{font-size:12px;color:var(--muted)}.age{font-weight:700;border-radius:20px;padding:3px 9px;display:inline-block}.status,.stagepill{font-weight:650;border-radius:20px;padding:4px 9px;display:inline-block;font-size:12px}.active{background:#e7f6ef;color:var(--green)}.hold{background:#fff2d9;color:var(--amber)}.rejected{background:#fde7e9;color:var(--red)}
.doc{background:#fff2d9;color:var(--amber)}.credit{background:#e9edff;color:var(--blue)}.sanction{background:#eee8fa;color:var(--purple)}.disbursement{background:#e3f5f7;color:var(--teal)}.disbursed{background:#e7f6ef;color:var(--green)}
.remark{max-width:360px}.details{background:#f7f8fb}.details td{font-size:13px;color:var(--muted)}.details span{margin-right:25px}.empty{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:900px){.summary{grid-template-columns:repeat(3,1fr)}header{align-items:flex-start;flex-direction:column}}
@media(max-width:550px){.summary{grid-template-columns:repeat(2,1fr)}.summary,.pipeline,header{padding-left:14px;padding-right:14px}.main{margin-left:14px;margin-right:14px}}
</style>
</head>
<body>
<header>
<div class="title"><h1>Monedo Case Dashboard</h1><p id="sub"></p></div>
<div class="toolbar">
<input id="search" placeholder="Search customer, LOS, person or pending action">

<select id="age"><option value="">All Ageing</option><option value="7">7+ days pending</option><option value="15">15+ days pending</option><option value="30">30+ days pending</option></select>
</div>
</header>
<section class="summary" id="summary"></section>
<section class="pipeline" id="pipeline"></section>

<div class="empty" id="empty" hidden>No matching cases.</div>
</section>

const STAGES=["Documents Pending","Under Credit Review","Sanction Received","Disbursement Pending","Disbursed"];
let selectedStage="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ageNum=v=>{const m=String(v??"").match(/-?\d+/);return m?Number(m[0]):0};

function deriveStage(d){
 const s=(d["CSV Status"]+" "+d["Status 2"]+" "+d["Pending / Remark"]+" "+d["Additional Remark"]).toLowerCase();
 if(/disburs|disburse|payout/.test(s))return"Disbursement Pending";
 if(/sanction|approved/.test(s))return"Sanction Received";
 if(/credit|login|logged|logined|query/.test(s))return"Under Credit Review";
 if(/doc|document|kyc|gst|itr|bank|pending from customer|pending from monedo|pending from lender/.test(s))return"Documents Pending";
 return"Documents Pending";
}
function deriveStatus(d){
 const s=(d["CSV Status"]+" "+d["Status 2"]).toLowerCase();
 if(/reject|cannot be done|not possible|dropped/.test(s))return"Rejected";
 if(/hold/.test(s))return"Hold";
 return"Active";
}
DATA.forEach(d=>{d.stage=deriveStage(d);d.status=deriveStatus(d);d.age=ageNum(d.Ageing);});

function filtered(){
 const q=document.getElementById("search").value.toLowerCase(), st=document.getElementById("status").value, ag=Number(document.getElementById("age").value||0);
 return DATA.filter(d=>
  (!selectedStage||d.stage===selectedStage)&&(!st||d.status===st)&&(!ag||d.age>=ag)&&
  (!q||[d.LOS,d.Customer,d.POC,d["Pending / Remark"],d["Additional Remark"],d.Contact].join(" ").toLowerCase().includes(q))
 );
}
function stageClass(s){return({"Documents Pending":"doc","Under Credit Review":"credit","Sanction Received":"sanction","Disbursement Pending":"disbursement","Disbursed":"disbursed"})[s]||"doc"}

function render(){
 const total=DATA.length, active=DATA.filter(d=>d.status==="Active").length, hold=DATA.filter(d=>d.status==="Hold").length, rejected=DATA.filter(d=>d.status==="Rejected").length;
 const old=DATA.filter(d=>d.status!=="Rejected"&&d.age>=15).length;
 document.getElementById("sub").textContent=`${total} cases loaded from Monedo MIS · ${active} active · ${hold} hold · ${rejected} rejected`;
 document.getElementById("summary").innerHTML=[
 ["Total Cases",total],["Active Cases",active],["On Hold",hold],["15+ Days Pending",old],["Disbursement Pending",DATA.filter(d=>d.stage==="Disbursement Pending").length],["Disbursed",DATA.filter(d=>d.stage==="Disbursed").length]
 ].map(x=>`<div class="card"><small>${x[0]}</small><b>${x[1]}</b></div>`).join("");

 document.getElementById("pipeline").innerHTML=STAGES.map(s=>{
  const n=DATA.filter(d=>d.stage===s&&d.status!=="Rejected").length;
  const desc={"Documents Pending":"Documents are awaited / being collected","Under Credit Review":"Case is under credit review","Sanction Received":"Sanction received; documentation in process","Disbursement Pending":"Approved case awaiting disbursement","Disbursed":"Amount disbursed"}[s];
  return `<button class="stage${selectedStage===s?" on":""}" data-stage="${esc(s)}"><b>${n}</b><span>${esc(s)}</span><small>${desc}</small></button>`;
 }).join("");
 document.querySelectorAll(".stage").forEach(b=>b.onclick=()=>{selectedStage=selectedStage===b.dataset.stage?"":b.dataset.stage;render()});

 const rows=filtered();
 document.getElementById("empty").hidden=rows.length>0;
 document.getElementById("body").innerHTML=rows.map(d=>{
  const ageClass=d.age>=30?"rejected":d.age>=15?"hold":d.age>=8?"hold":"active";
  return `<tr>
  <td><b>${esc(d.LOS)}</b></td><td><div class="name">${esc(d.Customer)}</div><div class="los">${esc(d.Month)}</div></td>
  <td>${esc(d.SCF)}</td><td><span class="age ${ageClass}">${esc(d.Ageing)}</span></td>
  <td><span class="stagepill ${stageClass(d.stage)}">${esc(d.stage)}</span></td>
  <td><span class="status ${d.status.toLowerCase()}">${esc(d.status)}</span></td>
  <td>${esc(d.POC)}</td><td class="remark">${esc(d["Pending / Remark"]||d["Additional Remark"]||"—")}</td><td>${esc(d.Contact)}</td>
  </tr>
  <tr class="details"><td colspan="9"><span><b>Original MIS Status:</b> ${esc(d["CSV Status"]||"—")}</span><span><b>Additional MIS Status:</b> ${esc(d["Status 2"]||"—")}</span><span><b>Additional Remark:</b> ${esc(d["Additional Remark"]||"—")}</span></td></tr>`;
 }).join("");
}
["search","status","age"].forEach(id=>document.getElementById(id).addEventListener("input",render));
render();
